name: kazumi
description: Kazumi — cute pixel-lofi anime VTuber livestreaming and social app (local-only v1).
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  permission_handler: ^12.0.3
  record: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/portraits/
    - assets/rooms/
